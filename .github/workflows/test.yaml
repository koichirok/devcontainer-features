name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - github-cli
          - gitlab-cli
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - github-cli
          - gitlab-cli
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      # Regenerate docs with the same owner/repo context as the release
      # workflow (devcontainers/action) and fail if committed READMEs drift,
      # so releases never need to create an automated documentation PR.
      - name: "Check feature docs are up to date"
        run: |
          devcontainer features generate-docs \
            --project-folder ./src \
            --namespace ${{ github.repository }} \
            --github-owner ${{ github.repository_owner }} \
            --github-repo ${{ github.event.repository.name }}
          if ! git diff --exit-code -- 'src/*/README.md'; then
            echo "::error::Feature README files are out of date. Run the command above and commit the result."
            exit 1
          fi

  ci-passed:
    runs-on: ubuntu-latest
    needs:
      - test-autogenerated
      - test-scenarios
      - docs-drift
    if: always()
    steps:
      - name: "Check that all required jobs succeeded"
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
